name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y python3-gi gir1.2-gtk-3.0 python3-cairo python3-gi-cairo python3-reportlab fonts-dejavu-core xvfb xauth device-tree-compiler nmap tshark iperf3
      - name: Compile Python and check launcher
        run: |
          /usr/bin/python3 -m compileall -q axiora*.py tests
          sh -n install-desktop.sh
          sh -n install-and-run.sh
          /usr/bin/python3 axiora_setup.py --dry-run
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile Raspberry Pi overlay
        run: dtc -@ -I dts -O dtb -o /tmp/axiora-spi.dtbo hardware/axiora-spi-overlay.dts
      - name: GTK integration test (no physical hardware)
        run: |
          xvfb-run -a /usr/bin/python3 tests/smoke_gui.py
          xvfb-run -a /usr/bin/python3 tests/smoke_workbench.py
